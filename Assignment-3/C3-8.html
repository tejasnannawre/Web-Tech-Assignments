<!DOCTYPE html>
<html>
<body>
<h2>Booking Form</h2>

<form>
    Select Booking Date:

    <input type="date" id="date" required>

    <input type="submit" value="Book">
</form>

<script>
let today = new Date().toISOString().split("T")[0];

document.getElementById("date").setAttribute("min", today);
</script>

</body>
</html>
