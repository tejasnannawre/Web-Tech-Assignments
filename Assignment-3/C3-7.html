<!DOCTYPE html>
<html>
<body>

<h2>Accessible Registration Form</h2>

<form role="form" aria-label="Registration Form">

    <label for="name">Name:</label>
    <input type="text" id="name"
           aria-label="Enter your name"><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email"
           aria-label="Enter your email"><br><br>

    <label for="password">Password:</label>
    <input type="password" id="password"
           aria-label="Enter your password"><br><br>

    <label for="gender">Gender:</label>
    <select id="gender" aria-label="Select gender">
        <option>Male</option>
        <option>Female</option>
    </select><br><br>

    <button type="submit" aria-label="Submit Registration">
        Register
    </button>

</form>

</body>
</html>
