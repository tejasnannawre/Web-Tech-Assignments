<!DOCTYPE html>
<html>
<body>

<canvas id="myCanvas" width="400" height="300"
style="border:1px solid black;">
</canvas>

<script>
var c = document.getElementById("myCanvas");
var ctx = c.getContext("2d");

// Rectangle
ctx.fillStyle = "red";
ctx.fillRect(30, 30, 100, 70);

// Circle
ctx.beginPath();
ctx.arc(220, 70, 40, 0, 2 * Math.PI);
ctx.fillStyle = "blue";
ctx.fill();

// Line
ctx.beginPath();
ctx.moveTo(30, 180);
ctx.lineTo(350, 180);
ctx.strokeStyle = "green";
ctx.lineWidth = 4;
ctx.stroke();
</script>

</body>
</html>
