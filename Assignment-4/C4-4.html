<!DOCTYPE html>
<html>
<head>
<style>
main {
    display: flex;
    gap: 20px;
}

section {
    width: 70%;
}

aside {
    width: 30%;
    background-color: lightgray;
    padding: 15px;
}
</style>
</head>
<body>

<header>
    <h1>Daily News</h1>
</header>

<main>

    <section>
        <article>
            <h2>Technology News</h2>
            <p>Artificial Intelligence is growing rapidly.</p>
        </article>

        <article>
            <h2>Sports News</h2>
            <p>India wins the cricket championship.</p>
        </article>
    </section>

    <aside>
        <h3>Latest Updates</h3>
        <p>Weather Update</p>
        <p>Education News</p>
    </aside>

</main>

<footer>
    <p>Daily News 2026</p>
</footer>

</body>
</html>
