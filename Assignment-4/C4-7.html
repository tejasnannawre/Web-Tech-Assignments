<!DOCTYPE html>
<html>
<body>

<canvas id="myCanvas" width="400" height="250"
style="border:1px solid black;">
</canvas>

<script>
var c = document.getElementById("myCanvas");
var ctx = c.getContext("2d");

// First Rectangle
var gradient1 = ctx.createLinearGradient(0, 0, 200, 0);
gradient1.addColorStop(0, "red");
gradient1.addColorStop(1, "yellow");

ctx.fillStyle = gradient1;
ctx.fillRect(20, 30, 160, 80);

// Second Rectangle
var gradient2 = ctx.createLinearGradient(0, 0, 200, 0);
gradient2.addColorStop(0, "blue");
gradient2.addColorStop(1, "green");

ctx.fillStyle = gradient2;
ctx.fillRect(20, 140, 160, 80);

</script>

</body>
</html>
