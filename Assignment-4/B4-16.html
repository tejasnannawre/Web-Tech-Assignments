<!DOCTYPE html>
<html>
<body>

<canvas id="myCanvas" width="300" height="200"
style="border:1px solid black;">
</canvas>

<script>
var c = document.getElementById("myCanvas");
var ctx = c.getContext("2d");

ctx.beginPath();
ctx.moveTo(0, 0);
ctx.lineTo(300, 200);
ctx.strokeStyle = "blue";
ctx.lineWidth = 3;
ctx.stroke();
</script>

</body>
</html>
