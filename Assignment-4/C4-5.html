<!DOCTYPE html>
<html>
<body>

<h2>Sunset Scene</h2>

<svg width="500" height="300">

    <!-- Sky -->
    <rect width="500" height="300" fill="skyblue"/>

    <!-- Sun -->
    <circle cx="250" cy="130" r="50" fill="orange"/>

    <!-- Ground -->
    <rect x="0" y="230" width="500" height="70"
          fill="green"/>

    <!-- Sun Rays -->
    <line x1="250" y1="50" x2="250" y2="10"
          stroke="orange" stroke-width="4"/>

    <line x1="180" y1="80" x2="150" y2="50"
          stroke="orange" stroke-width="4"/>

    <line x1="320" y1="80" x2="350" y2="50"
          stroke="orange" stroke-width="4"/>

    <line x1="170" y1="140" x2="120" y2="140"
          stroke="orange" stroke-width="4"/>

    <line x1="330" y1="140" x2="380" y2="140"
          stroke="orange" stroke-width="4"/>

</svg>

</body>
</html>
