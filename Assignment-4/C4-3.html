<!DOCTYPE html>
<html>
<head>
<style>
.gallery {
    display: flex;
    gap: 20px;
}

figure img {
    width: 200px;
    height: 150px;
}
</style>
</head>
<body>

<h1>Photo Gallery</h1>

<div class="gallery">

    <figure>
        <img src="nature.jpg">
        <figcaption>Beautiful Nature</figcaption>
    </figure>

    <figure>
        <img src="flower.jpg">
        <figcaption>Beautiful Flowers</figcaption>
    </figure>

    <figure>
        <img src="mountain.jpg">
        <figcaption>Mountain View</figcaption>
    </figure>

</div>

</body>
</html>
