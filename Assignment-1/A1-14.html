<!DOCTYPE html>
<html>
<head>
    <title>HTML Entities</title>
</head>
<body>

    <h1>HTML Entities and Symbols</h1>

    <h2>Special Characters</h2>

    <p>Less Than: &lt;</p>

    <p>Greater Than: &gt;</p>

    <p>Ampersand: &amp;</p>

    <p>Copyright: &copy;</p>

    <p>Registered: &reg;</p>

    <p>Trademark: &trade;</p>

    <p>Rupee: &#8377;</p>

    <h2>Emojis</h2>

    <p>😀 😊 🎓 💻 🚀 📚</p>

    <h2>Mathematical Symbols</h2>

    <p>Plus: &plus;</p>

    <p>Division: &divide;</p>

    <p>Multiplication: &times;</p>

</body>
</html>
