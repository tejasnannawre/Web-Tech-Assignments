<!DOCTYPE html>
<html>
<head>
    <title>HTML Tables</title>
</head>
<body>

    <h1>Student Marksheet</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Java</th>
            <th>DBMS</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Vaishnavi</td>
            <td>85</td>
            <td>90</td>
        </tr>

        <tr>
            <td>102</td>
            <td>Priya</td>
            <td>88</td>
            <td>92</td>
        </tr>
    </table>

    <h1>Class Timetable</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>Day</th>
            <th>9-10 AM</th>
            <th>10-11 AM</th>
        </tr>

        <tr>
            <td>Monday</td>
            <td>Java</td>
            <td>DBMS</td>
        </tr>

        <tr>
            <td>Tuesday</td>
            <td>Python</td>
            <td>Web Technology</td>
        </tr>
    </table>

    <h1>Fee Receipt</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>Description</th>
            <th>Amount</th>
        </tr>

        <tr>
            <td>Tuition Fees</td>
            <td>40000</td>
        </tr>

        <tr>
            <td>Library Fees</td>
            <td>2000</td>
        </tr>

        <tr>
            <th>Total</th>
            <th>42000</th>
        </tr>
    </table>

</body>
</html>
