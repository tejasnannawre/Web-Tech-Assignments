<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>
</head>
<body>

    <h1>My Image Gallery</h1>

    <h2>Insert Image</h2>

    <img src="image1.jpg" width="300" height="200"
         alt="College Image">

    <h2>Aligned Image</h2>

    <p>
        <img src="image2.jpg" width="200" height="150"
             align="right" alt="Campus">
        Welcome to our college.
    </p>

    <br><br><br><br><br>

    <h2>Image as Hyperlink</h2>

    <a href="https://www.google.com">
        <img src="image3.jpg" width="200" alt="Click Image">
    </a>

    <h2>Image Gallery</h2>

    <img src="image1.jpg" width="150" alt="Image 1">
    <img src="image2.jpg" width="150" alt="Image 2">
    <img src="image3.jpg" width="150" alt="Image 3">

</body>
</html>
