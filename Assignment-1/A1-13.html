<!DOCTYPE html>
<html>
<head>
    <title>Iframe Demonstration</title>
</head>
<body>

    <h1>Iframe Examples</h1>

    <h2>Google Maps</h2>

    <iframe
        src="https://www.google.com/maps?q=Pune&output=embed"
        width="500"
        height="300">
    </iframe>

    <h2>Website</h2>

    <iframe
        src="https://example.com"
        width="500"
        height="300">
    </iframe>

    <h2>YouTube Video</h2>

    <iframe
        width="500"
        height="300"
        src="https://www.youtube.com/embed/tgbNymZ7vqY"
        allowfullscreen>
    </iframe>

</body>
</html>
