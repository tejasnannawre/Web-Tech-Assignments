<!DOCTYPE html>
<html>
<body>
    <h2>Tables From 1 to 30</h2>

    <div id="result"></div>

    <script>
        let str = "";

        for (let i = 1; i <= 30; i++) {
            str += "<h3>Table of " + i + "</h3>";

            for (let j = 1; j <= 10; j++) {
                str += i + " x " + j + " = " + (i * j) + "<br>";
            }
        }

        document.getElementById("result").innerHTML = str;
    </script>
</body>
</html>
