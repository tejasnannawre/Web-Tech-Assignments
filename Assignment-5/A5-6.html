<!DOCTYPE html>
<html>
<body>
    <h2>Odd Numbers Between 1 and 100</h2>

    <p id="result"></p>

    <script>
        let str = "";

        for (let i = 1; i <= 100; i++) {
            if (i % 2 != 0) {
                str += i + " ";
            }
        }

        document.getElementById("result").innerHTML = str;
    </script>
</body>
</html>
