<!DOCTYPE html>
<html>
<body>
    <h2>Function With Parameters</h2>

    <script>
        function addition(a, b) {
            return a + b;
        }

        function multiplication(a, b) {
            return a * b;
        }

        let x = 10;
        let y = 20;

        document.write("First Number: " + x + "<br>");
        document.write("Second Number: " + y + "<br>");

        document.write("Addition: " + addition(x, y) + "<br>");
        document.write("Multiplication: " + multiplication(x, y));
    </script>
</body>
</html>
