<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
</head>
<body>
    <h2>Simple Calculator</h2>

    Number 1: <input type="number" id="n1"><br><br>
    Number 2: <input type="number" id="n2"><br><br>

    <button onclick="calculate('+')">Addition</button>
    <button onclick="calculate('-')">Subtraction</button>
    <button onclick="calculate('*')">Multiplication</button>
    <button onclick="calculate('/')">Division</button>

    <h3 id="result"></h3>

    <script>
        function calculate(op) {
            let a = Number(document.getElementById("n1").value);
            let b = Number(document.getElementById("n2").value);
            let r;

            switch (op) {
                case '+': r = a + b; break;
                case '-': r = a - b; break;
                case '*': r = a * b; break;
                case '/':
                    if (b == 0) {
                        alert("Cannot divide by zero");
                        return;
                    }
                    r = a / b;
                    break;
            }

            document.getElementById("result").innerHTML =
                "Result: " + r;
        }
    </script>
</body>
</html>
