<!DOCTYPE html>
<html>
<body>
    <h2>Prime Numbers Between 1 and 100</h2>

    <p id="result"></p>

    <script>
        let str = "";

        for (let i = 2; i <= 100; i++) {
            let prime = true;

            for (let j = 2; j < i; j++) {
                if (i % j == 0) {
                    prime = false;
                    break;
                }
            }

            if (prime) {
                str += i + " ";
            }
        }

        document.getElementById("result").innerHTML = str;
    </script>
</body>
</html>
